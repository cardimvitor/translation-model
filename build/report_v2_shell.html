<title>Label Normalizer Report</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one reading column (about 70 characters); tables and figures may run wider inside their own scroll boxes. */
:root {
  --bg: #f7f8fa; --panel: #ffffff; --ink: #14181f; --ink-2: #4a5361; --ink-3: #6f7886; --line: #dfe3ea; --accent: #1f5fbf; --accent-soft: #e8f0fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --ref: #6f7886;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151a; --panel: #1a1e25; --ink: #eceff4; --ink-2: #b9c1cd; --ink-3: #8b94a3; --line: #2c323c; --accent: #7fb0f5; --accent-soft: #1c2a40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --ref: #8b94a3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1a1e25; --ink: #eceff4; --ink-2: #b9c1cd; --ink-3: #8b94a3; --line: #2c323c; --accent: #7fb0f5; --accent-soft: #1c2a40;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --ref: #8b94a3; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); }
main { max-width: 1040px; margin: 0 auto; padding-block: 40px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 44px; }
header, section { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
p, ul, ol, h1, h2, h3, figure { margin: 0; }
p, li, .lede { max-width: 72ch; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
h1 { font: 600 clamp(34px, 6vw, 52px)/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
h2 { font: 600 26px/1.2 var(--display); letter-spacing: -.01em; text-wrap: balance; padding-top: 28px; border-top: 1px solid var(--line); }
h3 { font: 600 17px/1.3 var(--body); margin-top: 8px; }
.lede { font-size: 19px; line-height: 1.5; color: var(--ink-2); }
a { color: var(--accent); text-underline-offset: 2px; } a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
code { font: 13.5px var(--mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
ul, ol { padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 8px; }
.kpis div { padding: 18px 20px 18px 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpis b { font: 600 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.kpis span { font-size: 14px; color: var(--ink-2); max-width: 30ch; }
nav { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
nav a { text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 1px; }
.note { background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; font-size: 14.5px; color: var(--ink-2); max-width: 78ch; }
.tw { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.hl td { background: var(--accent-soft); }
.wide table { min-width: 760px; }
.flow { list-style: none; padding: 0; counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.flow li { counter-increment: s; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: 14.5px; color: var(--ink-2); max-width: none; min-width: 0; }
.flow li::before { content: "Step " counter(s); display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
.flow b { color: var(--ink); }
.story { display: flex; flex-direction: column; gap: 18px; }
.story div { display: grid; grid-template-columns: minmax(180px, 260px) minmax(0, 1fr); gap: 6px 28px; }
.story h3 { margin: 0; font-size: 15.5px; }
.story p { color: var(--ink-2); font-size: 15px; }
@media (max-width: 640px) { .story div { grid-template-columns: 1fr; } }
.lessons li { max-width: 78ch; }
.viz { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; min-width: 0; }
figcaption { display: flex; flex-direction: column; gap: 2px; } figcaption span { font-size: 13.5px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); }
.sw { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.s1b { background: var(--s1); } .s2b { background: var(--s2); } .s3b { background: var(--s3); }
.sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; } .refb { background: repeating-linear-gradient(90deg, var(--ref) 0 4px, transparent 4px 7px); }
svg { display: block; width: 100%; min-width: 620px; height: auto; }
.grid { stroke: var(--line); stroke-width: 1; } .ref { stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 4 3; }
.ax { fill: var(--ink-3); font: 11.5px var(--body); } .lab { fill: var(--ink-2); font: 12px var(--body); }
.ln { fill: none; stroke-width: 2; stroke-linejoin: round; } .ln.s1 { stroke: var(--s1); } .ln.s2 { stroke: var(--s2); }
.pt { stroke: var(--panel); stroke-width: 2; } .s1f { fill: var(--s1); } .s2f { fill: var(--s2); } .s3f { fill: var(--s3); }
.bar { stroke: var(--panel); stroke-width: 1; } .val { fill: var(--ink); font: 600 11.5px var(--body); font-variant-numeric: tabular-nums; }
.hit { fill: transparent; cursor: default; } .hit:hover { fill: var(--accent-soft); fill-opacity: .5; }
.tip { position: absolute; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 8px 10px; border-radius: 6px; pointer-events: none; line-height: 1.45; z-index: 2; }
details summary { cursor: pointer; font-size: 13.5px; color: var(--accent); } details .tw { margin-top: 10px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.brow { display: grid; grid-template-columns: minmax(150px, 280px) minmax(60px, 1fr) 44px; gap: 12px; align-items: center; font-size: 13.5px; }
.bn { color: var(--ink-2); min-width: 0; } .bv { text-align: right; font-variant-numeric: tabular-nums; }
.bt { height: 14px; display: block; } .bf { display: block; height: 100%; background: var(--ref); border-radius: 0 4px 4px 0; opacity: .55; } .bf.on { background: var(--s1); opacity: 1; }
@media (max-width: 520px) { .brow { grid-template-columns: 1fr 44px; } .bt { grid-column: 1 / -1; grid-row: 2; } }
footer { font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 16px; }
@media print { body { background: #fff; } main { max-width: none; gap: 28px; padding-block: 0; } h2 { break-after: avoid; } tr, .story div, .viz, .flow li { break-inside: avoid; } .tw { overflow: visible; } .wide table, svg { min-width: 0; } table { font-size: 10.5px; } nav, details { display: none; } }
</style>
<main>
{{BODY}}
<footer>Rebuilt from scratch on Nov 15, 2026. Numbers come from the result files of each version; the earlier, longer report is kept in the repository as a PDF.</footer>
</main>
<script>
(function () {
  document.querySelectorAll("svg.hov").forEach(function (svg) {
    var fig = svg.closest("figure"), t = document.createElement("div"); t.className = "tip"; t.hidden = true; fig.appendChild(t);
    svg.querySelectorAll(".hit").forEach(function (r) {
      r.addEventListener("mousemove", function (e) { t.innerHTML = r.dataset.tip; t.hidden = false; var b = fig.getBoundingClientRect();
        t.style.left = Math.min(e.clientX - b.left + 12, b.width - 190) + "px"; t.style.top = (e.clientY - b.top + 12) + "px"; });
      r.addEventListener("mouseleave", function () { t.hidden = true; });
    });
  });
  var tip = document.getElementById("tip"), fig = tip && tip.parentElement;
  if (!tip) return;
  document.querySelectorAll("#chart .hit").forEach(function (r) {
    r.addEventListener("mousemove", function (e) {
      tip.innerHTML = "<b>" + r.dataset.n + "</b><br>Labels: " + r.dataset.a + "<br>Real names: " + r.dataset.b;
      tip.hidden = false; var b = fig.getBoundingClientRect();
      tip.style.left = Math.min(e.clientX - b.left + 12, b.width - 150) + "px"; tip.style.top = (e.clientY - b.top + 12) + "px";
    });
    r.addEventListener("mouseleave", function () { tip.hidden = true; });
  });
})();
</script>
